name: CI

on:
  push:
    branches:
      - main
      - development
      - feature-tests
      - feature-code
      - impl-fibonacci
      - impl-pin
  pull_request:
    branches:
      - feature-code
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
